<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendataan Anak Yayasan Karya Murni Ruteng</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->

</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col"></div>

    <script>
        const DEFAULT_CREDENTIALS = { user: 'admin', pass: '123456' };
        const DEFAULT_SETTINGS = {
            foundationName: 'Yayasan Karya Murni Ruteng',
            foundationSubtitle: 'Pusat Data & Administrasi Anak Asuh / Peserta Didik',
            logoUrl: 'https://placehold.co/120x120/1e293b/ffffff?text=YKM'
        };

        const EDUCATION_OPTIONS = [
            'TK',
            'SD', 
            'SMP', 
            'SMA', 
            'SMK', 
            'TAMAT SD', 
            'TAMAT SMP', 
            'TAMAT SMA', 
            'KULIAH', 
            'Lainnya'
        ];

        function getStoredData(key, fallback) {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : fallback;
            } catch (e) {
                return fallback;
            }
        }

        function setStoredData(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }

        let state = {
            currentUser: null, 
            activeTab: 'dashboard', 
            credentials: getStoredData('ykm_creds', DEFAULT_CREDENTIALS),
            settings: getStoredData('ykm_settings', DEFAULT_SETTINGS),
            children: getStoredData('ykm_children', [
                {
                    id: '1',
                    name: 'Yohanes Rian Mandur',
                    birthDate: '2012-05-14',
                    gender: 'Laki-laki',
                    classLevel: 'Kelas 5',
                    education: 'SD',
                    domicile: 'Ruteng Kota',
                    disability: 'Tuna Rungu'
                },
                {
                    id: '2',
                    name: 'Maria Florentina Ningsih',
                    birthDate: '2010-08-21',
                    gender: 'Perempuan',
                    classLevel: 'Kelas 8',
                    education: 'SMP',
                    domicile: 'Wae Belang',
                    disability: 'Tuna Netra'
                },
                {
                    id: '3',
                    name: 'Petrus Damianus Gonsalves',
                    birthDate: '2005-03-10',
                    gender: 'Laki-laki',
                    classLevel: 'Alumni',
                    education: 'TAMAT SMA',
                    domicile: 'Carep',
                    disability: 'Disabilitas Daksa'
                }
            ]),
            // Filters for main table
            filterSearch: '',
            filterGender: [],
            filterEducation: [],
            filterDomicile: [],
            filterDisability: [],
            filterAgeMin: '',
            filterAgeMax: '',
            // Modal states
            modalOpen: false,
            editingChild: null,
            actionVerifyModal: false,
            pendingAction: null, 
            verifyPasswordInput: '',
            verifyError: '',
            // Category drill-down Modal state
            drillDownModal: {
                open: false,
                title: '',
                categoryKey: '', 
                categoryValue: '',
                search: '',
                gender: [],
                education: [],
                domicile: [],
                disability: [],
                ageMin: '',
                ageMax: ''
            },
            toast: null
        };

        function saveState() {
            setStoredData('ykm_children', state.children);
            setStoredData('ykm_settings', state.settings);
            setStoredData('ykm_creds', state.credentials);
        }

        function showToast(message, type = 'success') {
            state.toast = { message, type };
            render();
            setTimeout(() => {
                if (state.toast && state.toast.message === message) {
                    state.toast = null;
                    render();
                }
            }, 3500);
        }

        function calculateAge(birthDateStr) {
            if (!birthDateStr) return 0;
            const today = new Date();
            const birthDate = new Date(birthDateStr);
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age >= 0 ? age : 0;
        }

        function convertImageFileToJpeg(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    const MAX_SIZE = 300;
                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, width, height);

                    const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.9);
                    callback(jpegDataUrl);
                };
                img.onerror = function() {
                    showToast("Gagal memuat file gambar logo!", "error");
                };
                img.src = e.target.result;
            };
            reader.onerror = function() {
                showToast("Gagal membaca file logo!", "error");
            };
            reader.readAsDataURL(file);
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            if (!state.currentUser) {
                app.innerHTML = renderLogin();
            } else {
                app.innerHTML = renderMainLayout();
            }

            attachEvents();
        }

        function renderLogin() {
            return `
                <div class="flex-1 flex items-center justify-center bg-gradient-to-br from-indigo-950 via-slate-900 to-slate-950 p-4">

                        <div class="absolute -left-16 -bottom-16 w-40 h-40 bg-purple-600/20 rounded-full blur-2xl pointer-events-none"></div>

                        <div class="text-center mb-8 relative z-10">
                            <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-600 rounded-2xl shadow-xl shadow-indigo-600/30 mb-4 text-3xl font-bold overflow-hidden border border-indigo-400/30">
                                <img src="${state.settings.logoUrl}" alt="Logo" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/80x80/1e293b/ffffff?text=YKM'">
                            </div>

                        </div>

                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-200 mb-2">Username</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-indigo-300">
                                        <i class="fa-solid fa-user text-sm"></i>
                                    </span>
                                    <input type="text" id="login-user" required placeholder="Masukkan username (admin)" 
                                        class="w-full pl-10 pr-4 py-3 bg-slate-950/60 border border-indigo-500/30 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-200 mb-2">Password</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-indigo-300">
                                        <i class="fa-solid fa-lock text-sm"></i>
                                    </span>
                                    <input type="password" id="login-pass" required placeholder="Masukkan password (123456)" 
                                        class="w-full pl-10 pr-4 py-3 bg-slate-950/60 border border-indigo-500/30 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">

                            </div>

                            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] transition font-semibold rounded-xl shadow-lg shadow-indigo-600/30 text-white flex items-center justify-center gap-2">

                            </button>
                        </form>

                        <div class="mt-6 p-4 rounded-xl bg-indigo-950/60 border border-indigo-500/20 text-xs text-indigo-200 text-center relative z-10">
                            <p class="font-semibold mb-1">Akses Default Admin:</p>
                            <p>Username: <code class="bg-black/40 px-1.5 py-0.5 rounded text-indigo-300 font-mono">admin</code> | Password: <code class="bg-black/40 px-1.5 py-0.5 rounded text-indigo-300 font-mono">123456</code></p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMainLayout() {
            return `
                <header class="bg-slate-900 text-white shadow-md no-print sticky top-0 z-40">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <img src="${state.settings.logoUrl}" alt="Logo" class="w-10 h-10 object-cover rounded-lg bg-white" onerror="this.src='https://placehold.co/40x40/1e293b/ffffff?text=YKM'">
                            <div>
                                <h1 class="font-bold text-sm sm:text-base leading-tight">${state.settings.foundationName}</h1>
                                <p class="text-xs text-slate-400 hidden sm:block">${state.settings.foundationSubtitle}</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-3">
                            <span class="text-xs bg-indigo-900/80 text-indigo-200 px-3 py-1.5 rounded-full font-medium border border-indigo-500/30 hidden md:inline-block">
                                <i class="fa-solid fa-user-shield mr-1"></i> ${state.currentUser}
                            </span>
                            <button id="btn-logout" class="bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 border border-rose-500/30">
                                <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Keluar</span>

                    </div>

                    <div class="bg-slate-950 border-t border-slate-800">

                            <button onclick="switchTab('dashboard')" class="px-4 py-3 text-xs sm:text-sm font-medium border-b-2 transition flex items-center gap-2 whitespace-nowrap ${state.activeTab === 'dashboard' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}">
                                <i class="fa-solid fa-chart-pie"></i> Dashboard & Rekapitulasi
                            </button>
                            <button onclick="switchTab('data')" class="px-4 py-3 text-xs sm:text-sm font-medium border-b-2 transition flex items-center gap-2 whitespace-nowrap ${state.activeTab === 'data' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}">
                                <i class="fa-solid fa-users-rectangle"></i> Pendataan Anak
                            </button>
                            <button onclick="switchTab('idcards')" class="px-4 py-3 text-xs sm:text-sm font-medium border-b-2 transition flex items-center gap-2 whitespace-nowrap ${state.activeTab === 'idcards' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}">
                                <i class="fa-solid fa-id-card"></i> Cetak Kartu ID
                            </button>
                            <button onclick="switchTab('settings')" class="px-4 py-3 text-xs sm:text-sm font-medium border-b-2 transition flex items-center gap-2 whitespace-nowrap ${state.activeTab === 'settings' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}">
                                <i class="fa-solid fa-gear"></i> Pengaturan
                            </button>
                        </div>
                    </div>
                </header>

                ${state.toast ? `
                    <div class="fixed bottom-5 right-5 z-50 animate-bounce no-print">
                        <div class="px-4 py-3 rounded-xl shadow-xl text-white font-medium text-sm flex items-center gap-2 ${state.toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}">
                            <i class="fa-solid ${state.toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i>
                            ${state.toast.message}
                        </div>
                    </div>
                ` : ''}

                <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
                    ${state.activeTab === 'dashboard' ? renderDashboard() : ''}
                    ${state.activeTab === 'data' ? renderDataManagement() : ''}
                    ${state.activeTab === 'idcards' ? renderIdCards() : ''}
                    ${state.activeTab === 'settings' ? renderSettings() : ''}
                </main>

                ${state.modalOpen ? renderChildModal() : ''}
                ${state.actionVerifyModal ? renderVerifyModal() : ''}
                ${state.drillDownModal.open ? renderDrillDownModal() : ''}
            `;
        }

        function renderDashboard() {
            const total = state.children.length;
            
            const genderCounts = {};
            const educationCounts = {};
            const domicileCounts = {};
            const disabilityCounts = {};
            const ageGroupCounts = { '< 7 Tahun': 0, '7 - 12 Tahun': 0, '13 - 15 Tahun': 0, '16 - 18 Tahun': 0, '> 18 Tahun': 0 };

            state.children.forEach(c => {
                const g = c.gender || 'Lainnya';
                genderCounts[g] = (genderCounts[g] || 0) + 1;

                const ed = c.education || 'Lainnya';
                educationCounts[ed] = (educationCounts[ed] || 0) + 1;

                const dom = c.domicile || 'Tidak Diketahui';
                domicileCounts[dom] = (domicileCounts[dom] || 0) + 1;

                const dis = c.disability ? c.disability.trim() : 'Tidak Ada / Belum Diisi';
                disabilityCounts[dis] = (disabilityCounts[dis] || 0) + 1;

                const age = calculateAge(c.birthDate);
                if (age < 7) ageGroupCounts['< 7 Tahun']++;
                else if (age <= 12) ageGroupCounts['7 - 12 Tahun']++;
                else if (age <= 15) ageGroupCounts['13 - 15 Tahun']++;
                else if (age <= 18) ageGroupCounts['16 - 18 Tahun']++;
                else ageGroupCounts['> 18 Tahun']++;
            });

            return `

                    <div>
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Dashboard & Kartu Rekapitulasi</h2>

                            <p class="text-xs text-indigo-200/80 mt-1">${state.settings.foundationName}</p>
                        </div>
                        <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center text-3xl text-indigo-300 border border-white/10">
                            <i class="fa-solid fa-users"></i>
                        </div>
                    </div>

                    <!-- Rekap Kategori: Jenis Kelamin -->
                    <div class="space-y-3">
                        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 flex items-center gap-2">
                            <i class="fa-solid fa-venus-mars text-indigo-600"></i> Rekapitulasi Berdasarkan Jenis Kelamin
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${Object.entries(genderCounts).map(([key, count]) => `
                                <div onclick="openDrillDown('Jenis Kelamin: ' + '${key}', 'gender', '${key}')" 
                                    class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:border-indigo-500 hover:shadow-md transition cursor-pointer flex items-center justify-between group">
                                    <div>
                                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Jenis Kelamin</p>
                                        <h4 class="text-xl font-bold text-slate-900 mt-1 group-hover:text-indigo-600 transition">${key}</h4>
                                        <p class="text-xs text-indigo-600 font-medium mt-1">${count} Anak (${Math.round((count/total)*100 || 0)}%)</p>
                                    </div>
                                    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl group-hover:bg-indigo-600 group-hover:text-white transition">
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Rekap Kategori: Jenis Disabilitas -->
                    <div class="space-y-3">
                        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 flex items-center gap-2">
                            <i class="fa-solid fa-wheelchair text-indigo-600"></i> Rekapitulasi Berdasarkan Jenis Disabilitas
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${Object.entries(disabilityCounts).map(([key, count]) => `
                                <div onclick="openDrillDown('Disabilitas: ' + '${key}', 'disability', '${key}')" 
                                    class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:border-indigo-500 hover:shadow-md transition cursor-pointer flex items-center justify-between group">
                                    <div>
                                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Jenis Disabilitas</p>
                                        <h4 class="text-xl font-bold text-slate-900 mt-1 group-hover:text-indigo-600 transition">${key}</h4>
                                        <p class="text-xs text-indigo-600 font-medium mt-1">${count} Anak (${Math.round((count/total)*100 || 0)}%)</p>
                                    </div>
                                    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl group-hover:bg-indigo-600 group-hover:text-white transition">
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Rekap Kategori: Tingkat Pendidikan -->
                    <div class="space-y-3">
                        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 flex items-center gap-2">
                            <i class="fa-solid fa-school text-indigo-600"></i> Rekapitulasi Berdasarkan Tingkat Pendidikan
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            ${EDUCATION_OPTIONS.map(edOption => {
                                const count = educationCounts[edOption] || 0;
                                return `
                                <div onclick="openDrillDown('Pendidikan: ' + '${edOption}', 'education', '${edOption}')" 
                                    class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:border-indigo-500 hover:shadow-md transition cursor-pointer flex items-center justify-between group">
                                    <div>
                                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Jenjang</p>
                                        <h4 class="text-lg font-bold text-slate-900 mt-1 group-hover:text-indigo-600 transition truncate">${edOption}</h4>
                                        <p class="text-xs text-indigo-600 font-medium mt-1">${count} Anak (${Math.round((count/total)*100 || 0)}%)</p>
                                    </div>
                                    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl group-hover:bg-indigo-600 group-hover:text-white transition shrink-0">
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </div>
                                </div>

                            }).join('')}

                    <!-- Rekap Kategori: Domisili -->
                    <div class="space-y-3">
                        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 flex items-center gap-2">
                            <i class="fa-solid fa-map-location-dot text-indigo-600"></i> Rekapitulasi Berdasarkan Domisili
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${Object.keys(domicileCounts).length === 0 ? '<p class="text-xs text-slate-400">Belum ada data domisili</p>' : Object.entries(domicileCounts).map(([key, count]) => `
                                <div onclick="openDrillDown('Domisili: ' + '${key}', 'domicile', '${key}')"

                                    <div>
                                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Wilayah</p>
                                        <h4 class="text-xl font-bold text-slate-900 mt-1 group-hover:text-indigo-600 transition">${key}</h4>
                                        <p class="text-xs text-indigo-600 font-medium mt-1">${count} Anak (${Math.round((count/total)*100 || 0)}%)</p>
                                    </div>
                                    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl group-hover:bg-indigo-600 group-hover:text-white transition">
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Rekap Kategori: Rentang Usia -->
                    <div class="space-y-3">
                        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 flex items-center gap-2">
                            <i class="fa-solid fa-cake-candles text-indigo-600"></i> Rekapitulasi Berdasarkan Rentang Usia
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${Object.entries(ageGroupCounts).map(([key, count]) => `
                                <div onclick="openDrillDownByAgeRange('${key}')" 
                                    class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:border-indigo-500 hover:shadow-md transition cursor-pointer flex items-center justify-between group">
                                    <div>
                                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Rentang Usia</p>
                                        <h4 class="text-xl font-bold text-slate-900 mt-1 group-hover:text-indigo-600 transition">${key}</h4>
                                        <p class="text-xs text-indigo-600 font-medium mt-1">${count} Anak (${Math.round((count/total)*100 || 0)}%)</p>
                                    </div>

        function openDrillDown(title, categoryKey, categoryValue) {
            state.drillDownModal = {
                open: true,
                title: title,
                categoryKey: categoryKey,
                categoryValue: categoryValue,
                search: '',
                gender: categoryKey === 'gender' ? [categoryValue] : [],
                education: categoryKey === 'education' ? [categoryValue] : [],
                domicile: categoryKey === 'domicile' ? [categoryValue] : [],
                disability: categoryKey === 'disability' ? [categoryValue] : [],
                ageMin: '',
                ageMax: ''
            };
            render();
        }

        function openDrillDownByAgeRange(rangeLabel) {
            let min = '', max = '';
            if (rangeLabel.includes('< 7')) { max = '6'; }
            else if (rangeLabel.includes('7 - 12')) { min = '7'; max = '12'; }
            else if (rangeLabel.includes('13 - 15')) { min = '13'; max = '15'; }
            else if (rangeLabel.includes('16 - 18')) { min = '16'; max = '18'; }
            else if (rangeLabel.includes('> 18')) { min = '19'; }

            state.drillDownModal = {
                open: true,
                title: 'Rentang Usia: ' + rangeLabel,
                categoryKey: 'ageRange',
                categoryValue: rangeLabel,
                search: '',
                gender: [],
                education: [],
                domicile: [],
                disability: [],
                ageMin: min,
                ageMax: max
            };
            render();
        }

        function closeDrillDown() {
            state.drillDownModal.open = false;
            render();
        }

        function getFilteredDrillDownChildren() {
            const m = state.drillDownModal;
            return state.children.filter(c => {
                const nameMatch = c.name.toLowerCase().includes(m.search.toLowerCase());
                const genderMatch = m.gender.length === 0 || m.gender.includes(c.gender);
                const eduMatch = m.education.length === 0 || m.education.includes(c.education);
                const domMatch = m.domicile.length === 0 || m.domicile.includes(c.domicile);
                const cDis = c.disability ? c.disability.trim() : 'Tidak Ada / Belum Diisi';
                const disMatch = m.disability.length === 0 || m.disability.includes(cDis);

                const age = calculateAge(c.birthDate);
                const minMatch = m.ageMin === '' || age >= parseInt(m.ageMin);
                const maxMatch = m.ageMax === '' || age <= parseInt(m.ageMax);

                return nameMatch && genderMatch && eduMatch && domMatch && disMatch && minMatch && maxMatch;
            });
        }

        function importExcelFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    const imported = json.map((row, idx) => ({
                        id: String(Date.now() + idx),
                        name: row['Nama Lengkap'] || row['nama'] || row['Name'] || 'Tanpa Nama',
                        birthDate: row['Tanggal Lahir'] || row['tanggal_lahir'] || '2012-01-01',
                        gender: row['Jenis Kelamin'] || row['gender'] || 'Laki-laki',
                        disability: row['Jenis Disabilitas'] || row['disability'] || row['disabilitas'] || '',
                        classLevel: row['Kelas'] || row['kelas'] || '-',
                        education: row['Tingkat Pendidikan'] || row['pendidikan'] || 'SD',
                        domicile: row['Domisili'] || row['domisili'] || 'Ruteng'
                    }));

                    state.children = [...state.children, ...imported];
                    saveState();
                    showToast(`Berhasil mengimpor ${imported.length} data anak!`);
                    render();
                } catch (err) {
                    showToast("Gagal membaca file Excel!", "error");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function attachEvents() {
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.onsubmit = function(e) {
                    e.preventDefault();
                    const u = document.getElementById('login-user').value;
                    const p = document.getElementById('login-pass').value;

                    if (u === state.credentials.user && p === state.credentials.pass) {
                        state.currentUser = u;
                        showToast("Berhasil masuk ke dashboard!");
                        render();
                    } else {
                        showToast("Username atau Password salah!", "error");
                    }
                };
            }

            const logoutBtn = document.getElementById('btn-logout');
            if (logoutBtn) {
                logoutBtn.onclick = function() {
                    state.currentUser = null;
                    showToast("Berhasil keluar.");
                    render();
                };
            }

            const childForm = document.getElementById('child-form');
            if (childForm) {
                childForm.onsubmit = function(e) {
                    e.preventDefault();
                    const name = document.getElementById('modal-name').value;
                    const birthDate = document.getElementById('modal-birth').value;
                    const gender = document.getElementById('modal-gender').value;
                    const disability = document.getElementById('modal-disability').value;
                    const classLevel = document.getElementById('modal-class').value;
                    const education = document.getElementById('modal-education').value;
                    const domicile = document.getElementById('modal-domicile').value;

                    if (state.editingChild) {
                        state.children = state.children.map(c => c.id === state.editingChild.id ? { ...c, name, birthDate, gender, disability, classLevel, education, domicile } : c);
                        showToast("Data anak berhasil diperbarui!");
                    } else {
                        const newChild = { id: String(Date.now()), name, birthDate, gender, disability, classLevel, education, domicile };
                        state.children.push(newChild);
                        showToast("Data anak berhasil ditambahkan!");
                    }

                    saveState();
                    closeModal();
                    render();
                };
            }

            const verifyForm = document.getElementById('verify-form');
            if (verifyForm) {
                verifyForm.onsubmit = function(e) {
                    e.preventDefault();
                    const passInput = document.getElementById('verify-pass-input').value;

                    if (passInput === state.credentials.pass) {
                        const action = state.pendingAction;
                        closeVerifyModal();

                        if (action.type === 'edit') {
                            state.editingChild = state.children.find(c => c.id === action.id);
                            state.modalOpen = true;
                            render();
                        } else if (action.type === 'delete') {
                            state.children = state.children.filter(c => c.id !== action.id);
                            saveState();
                            showToast("Data anak berhasil dihapus!");
                            render();
                        } else if (action.type === 'deleteAll') {
                            state.children = [];
                            saveState();
                            showToast("Semua data anak berhasil dihapus!");
                            render();
                        }
                    } else {
                        state.verifyError = "Password aplikasi salah!";
                        render();
                    }
                };
            }

            const settingsForm = document.getElementById('settings-form');
            if (settingsForm) {
                settingsForm.onsubmit = function(e) {
                    e.preventDefault();
                    const name = document.getElementById('set-name').value;
                    const subtitle = document.getElementById('set-subtitle').value;
                    const newUser = document.getElementById('set-user').value;
                    const newPass = document.getElementById('set-pass').value;

                    state.settings.foundationName = name;
                    state.settings.foundationSubtitle = subtitle;
                    state.credentials.user = newUser;
                    if (newPass) {
                        state.credentials.pass = newPass;
                    }

                    const logoFile = document.getElementById('set-logo-file').files[0];
                    if (logoFile) {
                        convertImageFileToJpeg(logoFile, function(jpegData) {
                            state.settings.logoUrl = jpegData;
                            saveState();
                            showToast("Pengaturan dan logo berhasil disimpan!");
                            render();
                        });
                    } else {
                        saveState();
                        showToast("Pengaturan berhasil disimpan!");
                        render();
                    }
                };
            }

            const mainSearch = document.getElementById('main-search-input');
            if (mainSearch) {
                mainSearch.oninput = function(e) {
                    state.filterSearch = e.target.value;
                };
            }

            const mainAgeMin = document.getElementById('main-agemin-input');
            if (mainAgeMin) {
                mainAgeMin.oninput = function(e) {
                    state.filterAgeMin = e.target.value;
                };
            }

            const mainAgeMax = document.getElementById('main-agemax-input');
            if (mainAgeMax) {
                mainAgeMax.oninput = function(e) {
                    state.filterAgeMax = e.target.value;
                };
            }

            const drillSearch = document.getElementById('drill-search-input');
            if (drillSearch) {
                drillSearch.oninput = function(e) {
                    state.drillDownModal.search = e.target.value;
                };
            }

            const drillAgeMin = document.getElementById('drill-agemin-input');
            if (drillAgeMin) {
                drillAgeMin.oninput = function(e) {
                    state.drillDownModal.ageMin = e.target.value;
                };
            }

            const drillAgeMax = document.getElementById('drill-agemax-input');
            if (drillAgeMax) {
                drillAgeMax.oninput = function(e) {
                    state.drillDownModal.ageMax = e.target.value;
                };
            }
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
